name: R30 Temporary Roadmap Sync

on:
  push:
    branches:
      - "r30-m9-alpha-usability-review"
    paths:
      - ".github/workflows/r30-roadmap-sync.yml"

permissions:
  contents: write

# One-shot closure helper; removed immediately after roadmap synchronization.
jobs:
  sync:
    if: github.repository == 'arvectum/arvectum-os' && github.ref == 'refs/heads/r30-m9-alpha-usability-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r30-m9-alpha-usability-review
      - name: Synchronize R30 and M9-alpha roadmap state
        shell: python
        run: |
          from pathlib import Path

          master = Path("docs/roadmap/ROADMAP.md")
          phase = Path("docs/roadmap/PHASE-9-PRODUCTIVE-WORKSPACE-DAILY-OPERATIONS.md")

          text = master.read_text(encoding="utf-8")
          text = text.replace("Version: `2.80.0`", "Version: `2.81.0`", 1)
          start = text.index("## 2. Version note")
          end = text.index("## 3. Architecture and governance baseline")
          version_note = '''## 2. Version note

Version `2.81.0` closes **`R30 — M9-alpha Usability / Information Architecture Review`** as `Complete / PASS`, records **`M9-alpha — Usable Internal Workspace`** as `Achieved / PASS` within its exact private internal scope, and advances Phase 9 to **`P9.07 — Product-owned workspace surfaces / composition`**.

R30 executed the integrated P9.01 J1–J4 ordinary path over the P9.03–P9.06 Productive Workspace and repaired four material usability/IA findings before closure:

1. real live My Work attention now continues to human Execution/Decision context;
2. real F1 object context now continues to the related governed action without internal-ID copy/paste;
3. global discovery exposes human-readable result-type narrowing;
4. SPA focus continuity and technical-evidence-on-demand behavior are explicit.

The exact integrated path is now `Home / My Work → real Execution context → human EIS search/narrowing → real object context → related governed action → real WAITING/fail-closed preflight`. Ordinary internal-ID dependency, terminal/GitHub escape, authority/success misrepresentation and Organization-scope violation are all false in the R30 acceptance record.

Clean implementation/reconciliation head `441106e65f7a69c54ff3ff89885ef1596b03e0a7` passed `Productive Workspace CI #60` / run `32487968433` and `Reference Python CI #292` / run `32487968464` (`1301 tests`, `OK`). Production assets are deterministic/release-pinned and temporary reconciliation helpers are absent from the closure state.

Canonical evidence: [`R30-m9-alpha-usability-information-architecture-review.md`](../reviews/R30-m9-alpha-usability-information-architecture-review.md). Detailed Phase 9 roadmap: [`PHASE-9-PRODUCTIVE-WORKSPACE-DAILY-OPERATIONS.md`](PHASE-9-PRODUCTIVE-WORKSPACE-DAILY-OPERATIONS.md) `Active 1.8.0`.

`M9-alpha` is internal usability evidence only. It does not establish public/customer Production, a public/stable browser/API/SDK surface, SLA/support/certification, Stable Product Contracts, Active Platform Capabilities, full M9 closure, manual daily-use dogfooding or Organizational/AI Authority.

'''
          text = text[:start] + version_note + text[end:]
          text = text.replace("`Active 1.7.0`", "`Active 1.8.0`")
          text = text.replace(
              '| **`R30`** | **M9-alpha Usability / Information Architecture Review** | **🟨 Current** |',
              '| `R30` | M9-alpha Usability / Information Architecture Review | 🟩 Complete / PASS |',
          )
          text = text.replace(
              '| `M9-alpha` | Usable Internal Workspace | ⬜ milestone |',
              '| `M9-alpha` | Usable Internal Workspace | 🟩 Achieved / PASS |',
          )
          text = text.replace(
              '| `P9.07` | Product-owned workspace surfaces / composition | ⬜ |',
              '| **`P9.07`** | **Product-owned workspace surfaces / composition** | **🟨 Current** |',
          )
          text = text.replace(
              'R30 usability / information architecture review              CURRENT\n        ↓\nM9-alpha — USABLE INTERNAL WORKSPACE',
              'R30 usability / information architecture review              PASS\n        ↓\nM9-alpha — USABLE INTERNAL WORKSPACE                  ACHIEVED\n        ↓\nP9.07 product-owned workspace surfaces / composition   CURRENT',
          )
          section = text.index("## 9. Current canonical action")
          text = text[:section] + '''## 9. Current canonical action

> **P9.07 — Product-owned workspace surfaces / composition.**

Compose at least two real product-owned surfaces into the Productive Workspace through explicit governed boundaries. Preserve product ownership of product schemas, workflows, approval rules, knowledge, templates and UX; do not move product business logic into shared platform code merely for convenience.

P9.07 must provide the implementation evidence needed for P9.01 J5 while preserving the R30/M9-alpha ordinary-path, authority, security and provenance guarantees. Product Contract and Platform Capability lifecycle states remain unchanged unless separately transitioned through their own governed decisions.
'''
          master.write_text(text, encoding="utf-8")

          text = phase.read_text(encoding="utf-8")
          text = text.replace("Version: `1.7.0`", "Version: `1.8.0`", 1)
          text = text.replace(
              '| **`R30`** | **M9-alpha Usability / Information Architecture Review** | **🟨 Current** | ordinary workflow usable without terminal/internal IDs |',
              '| `R30` | M9-alpha Usability / Information Architecture Review | 🟩 Complete / PASS | ordinary workflow usable without terminal/internal IDs |',
          )
          text = text.replace(
              '| `M9-alpha` | Usable Internal Workspace | ⬜ milestone | daily core work usable through browser UI |',
              '| `M9-alpha` | Usable Internal Workspace | 🟩 Achieved / PASS | daily core work usable through browser UI |',
          )
          text = text.replace(
              '| `P9.07` | Product-owned workspace surfaces / composition | ⬜ | at least two real product surfaces inside Workspace |',
              '| **`P9.07`** | **Product-owned workspace surfaces / composition** | **🟨 Current** | at least two real product surfaces inside Workspace |',
          )
          marker = "## 14. M9 exit criteria"
          insert = '''## 14. R30 / M9-alpha review result

Status: `R30 Complete / PASS`; `M9-alpha Achieved / PASS` within the exact private internal scope.

Canonical evidence: [`R30-m9-alpha-usability-information-architecture-review.md`](../reviews/R30-m9-alpha-usability-information-architecture-review.md).

R30 completed three functional cross-review iterations. Material findings repaired the ordinary J1→J3 attention/context continuation, J2 result-type narrowing, J3→J4 governed continuation, SPA focus management and technical-evidence-on-demand behavior. The final iteration found no remaining material objection.

The integrated P9.01 J1–J4 acceptance path passes with:

- no ordinary terminal/GitHub/internal-ID dependency;
- real EIS-backed human discovery/context with `External Reference` authority preserved;
- real retained Execution/Decision context in human terms;
- independent Authorization, Organizational Authority, Data Governance and Consequential Approval states;
- real P7.06-UI4 `WAITING / fail-closed` preflight through the normal Productive Workspace;
- no browser-provided authority, canonical mutation or external effect;
- exact technical identity/version/provenance rendered only after explicit drill-down;
- text-first critical state and explicit main-focus continuity on SPA navigation.

Clean implementation/reconciliation head `441106e65f7a69c54ff3ff89885ef1596b03e0a7` passed Productive Workspace CI #60 / run `32487968433` and Reference Python CI #292 / run `32487968464` (`1301 tests`, `OK`).

`M9-alpha` therefore satisfies all declared section 13 exit criteria. This is scoped internal usability evidence, not a public/stable interface, customer Production/readiness claim, lifecycle promotion, full M9 closure or substitute for P9.11 real daily-use dogfooding.

'''
          if marker not in text:
              raise SystemExit("M9 exit marker missing")
          text = text.replace(marker, insert + "## 15. M9 exit criteria", 1)
          text = text.replace("## 15. Explicit non-goals", "## 16. Explicit non-goals", 1)
          text = text.replace("## 16. Current canonical action", "## 17. Current canonical action", 1)
          section = text.index("## 17. Current canonical action")
          text = text[:section] + '''## 17. Current canonical action

> **P9.07 — Product-owned workspace surfaces / composition.**

Compose at least two real product-owned surfaces into Workspace through explicit Product Contract/extension boundaries while keeping product schemas, workflows, approvals, knowledge, templates and UX product-owned. The shared platform application must remain domain-neutral and must not gain hidden access to product internals.

P9.07 is the first post-M9-alpha implementation slice and targets the evidence needed for P9.01 J5. M9 remains open; P9.08–P9.12 and R31/R32 still govern the remaining AI, activity, company composition, dogfooding and hardening work.
'''
          phase.write_text(text, encoding="utf-8")

      - name: Commit roadmap synchronization
        run: |
          git add docs/roadmap/ROADMAP.md docs/roadmap/PHASE-9-PRODUCTIVE-WORKSPACE-DAILY-OPERATIONS.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "R30 synchronize milestone roadmaps"
          git push origin HEAD:r30-m9-alpha-usability-review
