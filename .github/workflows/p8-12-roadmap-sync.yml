name: P8.12 Final One-shot Status Sync

on:
  push:
    branches:
      - p8-12-m8-closure

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[p8-12-final-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p8-12-m8-closure
          fetch-depth: 0

      - name: Remove stale active-tense wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/roadmap/PHASE-8-ECOSYSTEM-EXTERNAL-INTEGRATION.md')
          text = path.read_text(encoding='utf-8')
          old = 'Phase 8 is now `Active` only for the bounded outcome approved by P8.00/A8:'
          new = 'Phase 8 was activated only for the bounded outcome approved by P8.00/A8:'
          if text.count(old) != 1:
              raise SystemExit(f'stale Phase 8 active-tense anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit final status sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Arvectum Roadmap Sync"
          git config user.email "actions@users.noreply.github.com"
          git add docs/roadmap/PHASE-8-ECOSYSTEM-EXTERNAL-INTEGRATION.md
          git diff --cached --quiet && { echo "No status change"; exit 1; }
          git commit -m "[p8-12-final-sync] remove stale Phase 8 active wording"
          git push origin HEAD:p8-12-m8-closure
