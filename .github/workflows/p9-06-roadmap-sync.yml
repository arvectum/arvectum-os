name: P9.06 Temporary Roadmap Sync

on:
  pull_request:
    paths:
      - ".github/workflows/p9-06-roadmap-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Synchronize canonical roadmaps
        shell: python
        run: |
          from pathlib import Path

          master = Path("docs/roadmap/ROADMAP.md")
          phase = Path("docs/roadmap/PHASE-9-PRODUCTIVE-WORKSPACE-DAILY-OPERATIONS.md")

          text = master.read_text(encoding="utf-8")
          text = text.replace("Version: `2.79.0`", "Version: `2.80.0`", 1)
          start = text.index("## 2. Version note")
          end = text.index("## 3. Architecture and governance baseline")
          version_note = '''## 2. Version note

Version `2.80.0` closes **`P9.06 — Executions / Decisions / governed actions UX`** as `Complete / PASS` after five functional cross-review iterations and advances Phase 9 to **`R30 — M9-alpha Usability / Information Architecture Review`**.

P9.06 adds the first normal Productive Workspace governed-action surface through Accepted ADR-0001:

1. human-readable inspection of the real retained EIS-backed Execution/Decision context;
2. independent Authorization, Organizational Authority, Data Governance and Consequential Approval states;
3. real owner-initiated P7.06-UI4 governed preflight through the React/TypeScript Workspace;
4. fresh server-side access and preflight revalidation at the POST command boundary;
5. fail-closed rejection of browser-supplied governance payloads;
6. truthful `WAITING / fail-closed` outcome with only minimized owner-local non-canonical proof evidence;
7. no canonical mutation, external effect, new authority engine or second source of truth;
8. exact Subject/Version/Execution/Event/provenance retained as drill-down evidence rather than ordinary navigation input.

The clean implementation/reconciliation head `627134709aa5348716b10ae9cac80afceb4bd8ed` passed `Productive Workspace CI #47` / run `32482850242` and `Reference Python CI #279` / run `32482850284` (`1301 tests`, `OK`). Exact CI-built production assets were reconciled and all temporary write-capable reconciliation helpers were removed from the closure state.

Canonical P9.06 evidence: [`P9-06-executions-decisions-governed-actions-ux.md`](../reviews/P9-06-executions-decisions-governed-actions-ux.md). Detailed Phase 9 roadmap: [`PHASE-9-PRODUCTIVE-WORKSPACE-DAILY-OPERATIONS.md`](PHASE-9-PRODUCTIVE-WORKSPACE-DAILY-OPERATIONS.md) `Active 1.7.0`.

The intermediate milestone remains **`M9-alpha — Usable Internal Workspace`** and is **not yet achieved**. P9.03–P9.06 now implement the declared J1–J4 building blocks, but R30 must still execute/review the integrated ordinary-path usability and information-architecture evidence before M9-alpha can be closed.

P9.06 closure does not create public/customer Production, Stable Product Contracts, Active Platform Capabilities, public/stable API/SDK/browser compatibility, SLA/support/certification, broader conformance or Organizational/AI authority.

'''
          text = text[:start] + version_note + text[end:]
          text = text.replace("`Active 1.6.0`", "`Active 1.7.0`")
          text = text.replace(
              '| **`P9.06`** | **Executions / Decisions / governed actions UX** | **🟨 Current** |',
              '| `P9.06` | Executions / Decisions / governed actions UX | 🟩 Complete / PASS |',
          )
          text = text.replace(
              '| `R30` | M9-alpha Usability / Information Architecture Review | ⬜ gate |',
              '| **`R30`** | **M9-alpha Usability / Information Architecture Review** | **🟨 Current** |',
          )
          text = text.replace(
              'P9.06 Executions/Decisions/governed actions             CURRENT\n        ↓\nR30 usability / information architecture review',
              'P9.06 Executions/Decisions/governed actions             PASS\n        ↓\nR30 usability / information architecture review              CURRENT',
          )
          section = text.index("## 9. Current canonical action")
          text = text[:section] + '''## 9. Current canonical action

> **R30 — M9-alpha Usability / Information Architecture Review.**

Execute the integrated P9.01 J1–J4 ordinary-path review through the normal private Productive Workspace. Verify that the owner can move from Home/My Work through human-readable discovery/context into the real governed preflight without terminal/GitHub/internal-ID knowledge, while preserving truthful authority/source/uncertainty semantics, fail-closed security and exact technical drill-down on demand.

R30 is the remaining gate before `M9-alpha`. P9.06 implementation completion does not by itself declare the milestone achieved.
'''
          master.write_text(text, encoding="utf-8")

          text = phase.read_text(encoding="utf-8")
          text = text.replace("Version: `1.6.0`", "Version: `1.7.0`", 1)
          text = text.replace(
              '| **`P9.06`** | **Executions / Decisions / governed actions UX** | **🟨 Current** | owner can inspect and perform one real governed action |',
              '| `P9.06` | Executions / Decisions / governed actions UX | 🟩 Complete / PASS | owner can inspect and perform one real governed action |',
          )
          text = text.replace(
              '| `R30` | M9-alpha Usability / Information Architecture Review | ⬜ gate | ordinary workflow usable without terminal/internal IDs |',
              '| **`R30`** | **M9-alpha Usability / Information Architecture Review** | **🟨 Current** | ordinary workflow usable without terminal/internal IDs |',
          )
          marker = "## 12. M9-alpha exit criteria"
          insert = '''## 12. P9.06 implementation and closure result

Status: `Complete / PASS`.

Canonical evidence: [`P9-06-executions-decisions-governed-actions-ux.md`](../reviews/P9-06-executions-decisions-governed-actions-ux.md).

P9.06 established the first normal Productive Workspace governed-action experience through the Accepted ADR-0001 boundary:

1. human-readable inspection of the real retained P7.06-UI4 EIS-backed Execution/Decision context;
2. truthful `ЕИС / zakupki.gov.ru` / `External Reference` source-authority presentation;
3. four independent governance decision concepts — Authorization, Organizational Authority, Data Governance and Consequential Approval — without collapsing technical access into authority;
4. a real owner-initiated `Run governed preflight` interaction through the React/TypeScript Workspace;
5. current server-side access plus fresh real preflight reconstruction at the POST command boundary;
6. fail-closed rejection of any browser-supplied governance payload before provider execution;
7. real `WAITING / fail-closed` result with minimized owner-local non-canonical proof evidence only;
8. no canonical mutation, external effect, new approval/authority engine, competing source of truth or product-specific business logic moved into the platform;
9. exact Subject/Version/Execution/Event/checkpoint/provenance available through technical drill-down rather than required ordinary navigation;
10. Workspace release `p9.06.1`, internal application contract `4`, still `bounded-internal-provisional` and non-public.

Functional cross-review completed five iterations. Material findings tightened the command-input boundary and reconciled the exact CI-built production assets; the fifth iteration found no remaining material objection.

Final implementation/reconciliation evidence before the closure/roadmap-only edits:

- implementation head `627134709aa5348716b10ae9cac80afceb4bd8ed`;
- `Productive Workspace CI #47` / run `32482850242` — `SUCCESS`;
- `Reference Python CI #279` / run `32482850284` — `SUCCESS`, `1301 tests`, `OK`;
- generated-Python-artifact rejection — `PASS`;
- frontend typecheck/tests/Web-Storage/build/reproducibility/release-pin gates — `PASS`;
- BFF security/context/governed-action tests — `PASS`;
- temporary asset-reconciliation workflow removed before closure.

P9.06 implements the P9.01 J4 real fail-closed governed-interaction slice without manufacturing missing governance decisions or a demo mutation. It does not itself achieve `M9-alpha`: R30 must still execute/review the integrated J1–J4 ordinary path and the remaining milestone evidence.

P9.06 creates no public/stable API, Product Contract or Platform Capability lifecycle transition, external/customer Production claim, broader conformance promise or Organizational Authority.

'''
          if marker not in text:
              raise SystemExit("Phase-9 M9-alpha marker missing")
          text = text.replace(marker, insert + "## 13. M9-alpha exit criteria", 1)
          text = text.replace("## 13. M9 exit criteria", "## 14. M9 exit criteria", 1)
          text = text.replace("## 14. Explicit non-goals", "## 15. Explicit non-goals", 1)
          text = text.replace("## 15. Current canonical action", "## 16. Current canonical action", 1)
          section = text.index("## 16. Current canonical action")
          text = text[:section] + '''## 16. Current canonical action

> **R30 — M9-alpha Usability / Information Architecture Review.**

Execute/review the complete P9.01 J1–J4 ordinary path through the new normal private Workspace: Home/My Work → human-readable discovery/context → real Execution/Decision → bounded real governed preflight. Confirm zero ordinary dependency on terminal/GitHub/internal IDs, truthful source/authority/uncertainty semantics, accessible textual meaning, fail-closed denial/unavailable behavior and exact technical identity/provenance available on demand.

The remaining near-term sequence is `R30 → M9-alpha`. P9.03–P9.06 provide the implemented building blocks; M9-alpha remains unachieved until the R30 gate and full declared exit set pass.
'''
          phase.write_text(text, encoding="utf-8")

      - name: Commit roadmap synchronization
        run: |
          git add docs/roadmap/ROADMAP.md docs/roadmap/PHASE-9-PRODUCTIVE-WORKSPACE-DAILY-OPERATIONS.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "P9.06 synchronize canonical roadmaps"
          git push origin HEAD:${GITHUB_HEAD_REF}
