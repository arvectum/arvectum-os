name: Productive Workspace CI

on:
  pull_request:
    paths:
      - "reference/python/workspace_app/**"
      - "reference/python/workspace_frontend/**"
      - "reference/python/workspace_tests/**"
      - "reference/python/p9_03_workspace.py"
      - ".github/workflows/workspace-app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: BFF security and context tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reference/python
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reference/python/workspace_app/requirements-dev.lock
      - name: Install locked BFF test dependencies
        run: python -m pip install --disable-pip-version-check -r workspace_app/requirements-dev.lock
      - name: Compile Workspace Python
        run: python -m compileall -q workspace_app workspace_tests p9_03_workspace.py
      - name: Run Workspace security/context tests
        run: python -m unittest discover -s workspace_tests -v

  frontend:
    name: SPA build, interaction, and storage gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reference/python/workspace_frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: reference/python/workspace_frontend/package-lock.json
      - name: Install exact frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test
      - name: Reject browser Web Storage
        run: npm run guard:web-storage
      - name: Rebuild production assets
        run: npm run build
      - name: Require committed lock and production assets to be reproducible
        run: git diff --exit-code -- package-lock.json dist
      - name: Verify release-pinned production asset boundary
        working-directory: reference/python
        run: python -c 'from pathlib import Path; from workspace_app.assets import verify_frontend_assets; from workspace_app.release import load_release; print(verify_frontend_assets(Path("workspace_frontend"), load_release()))'

  sync-roadmap:
    name: One-shot P9.05 canonical roadmap synchronization
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 116 &&
      github.event.pull_request.head.ref == 'p9-05-human-friendly-discovery' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'arvectum'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: p9-05-human-friendly-discovery
      - name: Synchronize master and Phase 9 roadmaps
        run: python reference/python/p9_05_sync_roadmaps.py
      - name: Verify roadmap synchronization diff
        run: |
          grep -F 'Version: `2.79.0`' docs/roadmap/ROADMAP.md
          grep -F '**`P9.06`** | **Executions / Decisions / governed actions UX** | **🟨 Current**' docs/roadmap/ROADMAP.md
          grep -F 'Version: `1.6.0`' docs/roadmap/PHASE-9-PRODUCTIVE-WORKSPACE-DAILY-OPERATIONS.md
          grep -F '## 11. P9.05 implementation and closure result' docs/roadmap/PHASE-9-PRODUCTIVE-WORKSPACE-DAILY-OPERATIONS.md
          grep -F '> **P9.06 — Executions / Decisions / governed actions UX.**' docs/roadmap/PHASE-9-PRODUCTIVE-WORKSPACE-DAILY-OPERATIONS.md
          git diff --check
      - name: Commit only canonical roadmap synchronization
        run: |
          git add -- docs/roadmap/ROADMAP.md docs/roadmap/PHASE-9-PRODUCTIVE-WORKSPACE-DAILY-OPERATIONS.md
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Close P9.05 and advance roadmap to P9.06"
          git push origin HEAD:p9-05-human-friendly-discovery
