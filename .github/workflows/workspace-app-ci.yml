name: Productive Workspace CI

on:
  pull_request:
    paths:
      - "reference/python/workspace_app/**"
      - "reference/python/workspace_frontend/**"
      - "reference/python/workspace_tests/**"
      - "reference/python/p9_03_workspace.py"
      - ".github/workflows/workspace-app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: BFF security and context tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reference/python
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reference/python/workspace_app/requirements-dev.lock
      - name: Install locked BFF test dependencies
        run: python -m pip install --disable-pip-version-check -r workspace_app/requirements-dev.lock
      - name: Compile Workspace Python
        run: python -m compileall -q workspace_app workspace_tests p9_03_workspace.py
      - name: Run Workspace security/context tests
        run: python -m unittest discover -s workspace_tests -v

  frontend:
    name: SPA build, interaction, and storage gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reference/python/workspace_frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: reference/python/workspace_frontend/package-lock.json
      - name: Install exact frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test
      - name: Reject browser Web Storage
        run: npm run guard:web-storage
      - name: Rebuild production assets
        run: npm run build
      - name: Upload rebuilt production assets for bounded reconciliation
        uses: actions/upload-artifact@v4
        with:
          name: p9-08-workspace-frontend-dist
          path: reference/python/workspace_frontend/dist
          include-hidden-files: true
          if-no-files-found: error
      - name: Report production asset reconciliation state
        run: |
          if git diff --quiet -- package-lock.json dist; then
            echo "Production assets already reproducible."
          else
            echo "Production assets require the bounded P9.08 reconciliation job."
          fi

  reconcile-assets:
    name: One-shot CI-built asset reconciliation
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Download CI-built production assets
        uses: actions/download-artifact@v4
        with:
          name: p9-08-workspace-frontend-dist
          path: /tmp/p9-08-workspace-frontend-dist
      - name: Reconcile only the generated dist tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reference/python/workspace_frontend/dist
          mkdir -p reference/python/workspace_frontend/dist
          cp -a /tmp/p9-08-workspace-frontend-dist/. reference/python/workspace_frontend/dist/
          if git diff --quiet -- reference/python/workspace_frontend/dist; then
            echo "No reconciliation commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reference/python/workspace_frontend/dist
          git commit -m "P9.08 reconcile CI-built Workspace assets"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
