name: Productive Workspace CI

on:
  pull_request:
    paths:
      - "reference/python/workspace_app/**"
      - "reference/python/workspace_frontend/**"
      - "reference/python/workspace_tests/**"
      - "reference/python/p9_03_workspace.py"
      - ".github/workflows/workspace-app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: BFF security and context tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reference/python
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reference/python/workspace_app/requirements-dev.lock
      - name: Install locked BFF test dependencies
        run: python -m pip install --disable-pip-version-check -r workspace_app/requirements-dev.lock
      - name: Compile Workspace Python
        run: python -m compileall -q workspace_app workspace_tests p9_03_workspace.py
      - name: Run Workspace security/context tests
        run: python -m unittest discover -s workspace_tests -v

  frontend:
    name: SPA build, interaction, and storage gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reference/python/workspace_frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: reference/python/workspace_frontend/package-lock.json
      - name: Install exact frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test
      - name: Reject browser Web Storage
        run: npm run guard:web-storage
      - name: Rebuild production assets
        run: npm run build
      - name: Require committed lock and production assets to be reproducible
        run: git diff --exit-code -- package-lock.json dist
      - name: Verify release-pinned production asset boundary
        working-directory: reference/python
        run: python -c 'from pathlib import Path; from workspace_app.assets import verify_frontend_assets; from workspace_app.release import load_release; print(verify_frontend_assets(Path("workspace_frontend"), load_release()))'

  p9-08-roadmap-repair:
    name: P9.08 roadmap read-after-write repair
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'p9-08-arvectum-ai-copilot'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Repair stale master-roadmap references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/roadmap/ROADMAP.md')
          text = path.read_text(encoding='utf-8')

          if text.count('`Active 1.8.0`') != 2:
              raise SystemExit(f'expected exactly 2 stale Phase 9 version refs, found {text.count("`Active 1.8.0`")}')
          text = text.replace('`Active 1.8.0`', '`Active 1.10.0`')

          old_path = '''P9.07 product-owned workspace surfaces / composition  CURRENT'''
          if text.count(old_path) != 1:
              raise SystemExit(f'expected one stale critical-path tail, found {text.count(old_path)}')
          text = text.replace(
              old_path,
              '''P9.07 product-owned workspace surfaces / composition  PASS\n        ↓\nP9.08 source-grounded Arvectum AI Copilot              PASS\n        ↓\nP9.09 activity / notifications / attention routing     CURRENT''',
              1,
          )

          old_para = 'M9-alpha is now achieved. The owner can begin using the new Workspace as the primary validation loop while P9.07–P9.12 add real product composition, AI assistance, activity/notifications, company-level composition and harden the daily-use baseline.'
          new_para = 'M9-alpha is achieved, and P9.07/P9.08 are now complete. The owner can continue using the Workspace as the primary validation loop while P9.09–P9.12 add activity/notifications, company-level composition, real daily-use dogfooding and final hardening.'
          if text.count(old_para) != 1:
              raise SystemExit(f'expected one stale Phase 9 continuation paragraph, found {text.count(old_para)}')
          text = text.replace(old_para, new_para, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Restore normal read-only workflow and commit roadmap repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git checkout origin/main -- .github/workflows/workspace-app-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/roadmap/ROADMAP.md .github/workflows/workspace-app-ci.yml
          git commit -m "P9.08 reconcile master roadmap closure references"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
