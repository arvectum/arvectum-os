name: P9.08 canonical closure sync

on:
  pull_request:
    paths:
      - ".github/workflows/p9-08-closure-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'p9-08-arvectum-ai-copilot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Write review evidence and synchronize roadmaps
        shell: bash
        run: |
          set -euo pipefail
