name: P9.10 review remediation helper

on:
  push:
    branches: [p9-10-arvectum-organization-composition]
    paths:
      - ".github/p9_10_review1.py"
      - ".github/workflows/p9-10-review1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p9-10-arvectum-organization-composition
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reference/python/workspace_app/requirements-dev.lock
      - run: python -m pip install --disable-pip-version-check -r reference/python/workspace_app/requirements-dev.lock
      - run: python .github/p9_10_review1.py
      - name: Backend verification
        working-directory: reference/python
        run: |
          python -m compileall -q workspace_app workspace_tests p9_03_workspace.py
          python -m unittest discover -s workspace_tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: reference/python/workspace_frontend/package-lock.json
      - name: Frontend verification and exact build
        working-directory: reference/python/workspace_frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run guard:web-storage
          npm run build
      - name: Release asset boundary
        working-directory: reference/python
        run: python -c 'from pathlib import Path; from workspace_app.assets import verify_frontend_assets; from workspace_app.release import load_release; print(verify_frontend_assets(Path("workspace_frontend"), load_release()))'
      - name: Commit remediation and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/python/workspace_app reference/python/workspace_tests reference/python/workspace_frontend
          git rm .github/p9_10_review1.py .github/workflows/p9-10-review1.yml
          git commit -m "P9.10: preserve knowledge semantics in organization composition"
          git push origin HEAD:p9-10-arvectum-organization-composition
