name: P9.03 bootstrap pinned assets

on:
  push:
    branches:
      - p9-03-real-workspace-shell
    paths:
      - "reference/python/workspace_app/requirements*.in"
      - "reference/python/workspace_frontend/**"
      - ".github/workflows/p9-03-bootstrap-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: p9-03-real-workspace-shell
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve exact Python runtime and test locks
        working-directory: reference/python
        shell: bash
        run: |
          python -m venv .lock-venv
          .lock-venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .lock-venv/bin/python -m pip install --disable-pip-version-check -r workspace_app/requirements.in
          .lock-venv/bin/python -m pip freeze --all | LC_ALL=C sort > workspace_app/requirements.lock
          .lock-venv/bin/python -m pip install --disable-pip-version-check -r workspace_app/requirements-dev.in
          .lock-venv/bin/python -m pip freeze --all | LC_ALL=C sort > workspace_app/requirements-dev.lock
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Resolve exact frontend lock and build production assets
        working-directory: reference/python/workspace_frontend
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run guard:web-storage
          npm run build
      - name: Commit generated exact-release evidence
        shell: bash
        run: |
          git add reference/python/workspace_app/requirements.lock \
                  reference/python/workspace_app/requirements-dev.lock \
                  reference/python/workspace_frontend/package-lock.json \
                  reference/python/workspace_frontend/dist
          if git diff --cached --quiet; then
            echo "Pinned assets already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: pin P9.03 application assets"
          git push origin HEAD:p9-03-real-workspace-shell
