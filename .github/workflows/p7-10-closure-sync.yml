name: P7.10 One-Shot Roadmap Sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p7-10-closure-sync.yml
      - tools/p7_10_closure_sync.py

permissions:
  contents: write

jobs:
  prepare-roadmap-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply bounded P7.10 closure synchronization
        run: python tools/p7_10_closure_sync.py

      - name: Create clean roadmap branch
        shell: bash
        run: |
          git config user.name "Arvectum Roadmap Sync"
          git config user.email "arvectum@gmail.com"
          git checkout -b p7-10-roadmap-final
          git rm .github/workflows/p7-10-closure-sync.yml tools/p7_10_closure_sync.py
          git add docs/roadmap/ROADMAP.md docs/roadmap/PHASE-7-OPERATIONAL-ENTERPRISE-READINESS.md
          git diff --cached --check
          git commit -m "docs: close P7.10 and advance to R23"
          git push origin HEAD:p7-10-roadmap-final
