name: P9.04 Dist Reconcile

on:
  pull_request:
    paths:
      - ".github/workflows/p9-04-dist-reconcile.yml"
      - "reference/python/workspace_app/release.json"
      - "reference/python/workspace_frontend/**"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'p9-04-my-work-needs-attention'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reference/python/workspace_frontend
    steps:
      - name: Check out exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: p9-04-my-work-needs-attention
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: reference/python/workspace_frontend/package-lock.json
      - name: Install exact frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Rebuild production assets
        run: npm run build
      - name: Commit exact rebuilt dist when changed
        working-directory: .
        run: |
          if git diff --quiet -- reference/python/workspace_frontend/dist; then
            echo "dist already reproducible"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/python/workspace_frontend/dist
          git commit -m "Reconcile P9.04 Workspace production assets"
          git push origin HEAD:p9-04-my-work-needs-attention
