name: P9.09 canonical closure sync

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p9-09-close.yml"

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p9-09-activity-notifications-attention-routing
          fetch-depth: 0
      - name: Apply canonical closure records
        run: python tools/p9_09_close.py
      - name: Commit closure records and remove helper
        run: |
          git rm tools/p9_09_close.py .github/workflows/p9-09-close.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P9.09 close activity notifications attention routing"
          git push origin HEAD:p9-09-activity-notifications-attention-routing
