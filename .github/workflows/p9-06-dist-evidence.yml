name: P9.06 Temporary Dist Evidence

on:
  pull_request:
    paths:
      - "reference/python/workspace_frontend/**"
      - ".github/workflows/p9-06-dist-evidence.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reference/python/workspace_frontend
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: reference/python/workspace_frontend/package-lock.json
      - name: Install exact frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build exact production assets
        run: npm run build
      - name: Upload exact production assets
        uses: actions/upload-artifact@v4
        with:
          name: p9-06-workspace-dist
          path: reference/python/workspace_frontend/dist
          include-hidden-files: true
          if-no-files-found: error
      - name: Reconcile deterministic dist onto PR branch
        run: |
          git add -A dist
          if git diff --cached --quiet; then
            echo "dist already exact"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "P9.06 reconcile exact CI-built Workspace assets"
          git push origin HEAD:${GITHUB_HEAD_REF}
