name: P7.11 Roadmap Sync

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/p7-11-roadmap-sync.yml"
      - ".github/scripts/p7_11_roadmap_sync.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/p7-11-roadmap-sync.yml"

permissions:
  contents: write

jobs:
  sync-roadmaps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply P7.11 roadmap synchronization
        run: python .github/scripts/p7_11_roadmap_sync.py

      - name: Commit synchronization and remove one-shot helpers
        shell: bash
        run: |
          git config user.name "Arvectum"
          git config user.email "arvectum@gmail.com"
          git rm .github/workflows/p7-11-roadmap-sync.yml .github/scripts/p7_11_roadmap_sync.py
          git add docs/roadmap/ROADMAP.md docs/roadmap/PHASE-7-OPERATIONAL-ENTERPRISE-READINESS.md
          git diff --cached --check
          git commit -m "docs: synchronize roadmaps after P7.11"
          git push origin HEAD:main
