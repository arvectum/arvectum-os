name: P7.11 Roadmap Sync

on:
  push:
    branches:
      - main
    paths:
      - "docs/reviews/P7-11-scoped-operational-readiness-lifecycle-conformance-stable-boundary-disposition.md"
      - "docs/reviews/P7-11-persistent-internal-conformance-statement.md"
      - ".github/workflows/p7-11-roadmap-sync.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/p7-11-roadmap-sync.yml"

permissions:
  contents: write

jobs:
  sync-roadmaps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize P7.11 closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          phase_path = Path("docs/roadmap/PHASE-7-OPERATIONAL-ENTERPRISE-READINESS.md")
          phase = phase_path.read_text()
          phase = replace_once(phase, "Version: `1.2.16`", "Version: `1.2.17`", "phase version")
          phase = replace_once(phase, "Updated: `2026-08-19`", "Updated: `2026-08-20`", "phase date")
          phase = replace_once(
              phase,
              "| `P7.11` | Scoped operational-readiness, lifecycle, conformance + stable-boundary disposition | Chat/GitHub + evidence | 🟨 Current | `░░░░░░░░░░ 0%` |",
              "| `P7.11` | Scoped operational-readiness, lifecycle, conformance + stable-boundary disposition | Chat/GitHub + evidence | 🟩 Complete / PASS | `██████████ 100%` |",
              "phase P7.11 row",
          )
          phase = replace_once(
              phase,
              "| `R24 — M7 Operational Hardening` | after `P7.11`, before `P7.12` | ⬜ | final bounded architecture/code/security/maintainability/fitness review and required M7 Milestone Code Health Gate |",
              "| `R24 — M7 Operational Hardening` | after `P7.11`, before `P7.12` | 🟨 `Current` | final bounded architecture/code/security/maintainability/fitness review and required M7 Milestone Code Health Gate |",
              "phase R24 row",
          )
          old_p711 = """### P7.11 — Scoped operational-readiness, lifecycle, conformance + stable-boundary disposition

Use accumulated evidence to decide whether the internal environment is fit for its declared scope; whether Product Contracts remain Provisional or justify separate Stable transitions; whether any CAP-001..CAP-004 capability justifies a separate `Active` admission process; which concrete boundaries crossed ADR/stable-boundary thresholds; and what Production/customer readiness remains unproven. No lifecycle transition occurs automatically inside P7.11.
"""
          new_p711 = """### P7.11 — Scoped operational-readiness, lifecycle, conformance + stable-boundary disposition

Status: `Complete / PASS`.

Canonical evidence:

- [`P7.11 — Scoped Operational-Readiness, Lifecycle, Conformance + Stable-Boundary Disposition`](../reviews/P7-11-scoped-operational-readiness-lifecycle-conformance-stable-boundary-disposition.md) — `Complete / PASS`, four functional review/revise iterations;
- [`P7.11 — Persistent Internal Scoped Conformance Statement`](../reviews/P7-11-persistent-internal-conformance-statement.md) — conformance maturity `Scoped` for operational environment `Local` / operating classification `Persistent Internal / owner-operated`.

P7.11 confirms that the declared one-Organization owner-operated contour is fit for ongoing internal governed use. The conformance subject is the deployment contour, so subject lifecycle is `Not Applicable`; capability and Product Contract lifecycles remain independently unchanged. CAP-001 through CAP-004 remain `Incubating / Provisional`, and P6.02/P6.06 remain `Provisional 0.1.0`.

All ten P7.01 ADR/stable-boundary triggers were rechecked. No current private persistence, launchd, identity/access, observability, deploy/update, operator-UI, cross-host handoff or recovery mechanism has become a stable/public/cross-product physical contract or an expensive-to-reverse external dependency. No new ADR is required at the current scope.

Exact-release recovery now explicitly depends on the required canonical release being retrievable from canonical Git history or another owner-controlled integrity-verifiable source copy. The primary supported operating contour remains the selected Mac mini; clean-secondary macOS and Linux CI evidence do not create a general supported-host matrix. Credentials/secrets, service-manager configuration, runtime roots, network/proxy/TLS and OS-specific filesystem/ownership remain separately reprovisioned prerequisites.

No external/customer Production, `Active` capability, Stable Product Contract, public/stable API/recovery format, SLA/SLO/RPO/RTO/support or certification claim is created. M7 criterion 11 is satisfied; R24 and the M7 Milestone Code Health Gate remain downstream.
"""
          phase = replace_once(phase, old_p711, new_p711, "phase P7.11 section")
          phase = replace_once(
              phase,
              "M7 criteria 9 and 10 are satisfied by P7.09 and P7.10 respectively for the declared `Persistent Internal / owner-operated` scope. R23 is `Complete / PASS`. Criteria 11–13 remain downstream.",
              "M7 criteria 9, 10 and 11 are satisfied by P7.09, P7.10 and P7.11 respectively for the declared `Persistent Internal / owner-operated` scope. R23 is `Complete / PASS`; P7.11 is `Complete / PASS`. Criteria 12 and 13 remain downstream through R24 and the required M7 Milestone Code Health Gate.",
              "phase M7 status",
          )
          phase_marker = "## 8. Current canonical action\n"
          if phase.count(phase_marker) != 1:
              raise SystemExit("phase current-action marker mismatch")
          phase = phase.split(phase_marker, 1)[0] + phase_marker + """> **R24 — M7 Operational Hardening + required Milestone Code Health Gate.**

P7.11 is `Complete / PASS`. The declared `Persistent Internal / owner-operated` contour is explicitly dispositioned fit for ongoing internal use; its RFC-0001 conformance maturity is `Scoped` for operational environment `Local`, while all Platform Capabilities remain `Incubating / Provisional` and P6.02/P6.06 remain `Provisional 0.1.0`. No P7.01 ADR/stable-boundary trigger is currently crossed, and no external/customer Production, stable/public interface, SLA/SLO/RPO/RTO/support or broader conformance commitment is created.

R24 must now perform the final bounded architecture/code/security/maintainability/fitness review and the required M7 Milestone Code Health Gate. P7.12 remains downstream until M7 criteria 12 and 13 are satisfied.
"""
          phase_path.write_text(phase)

          roadmap_path = Path("docs/roadmap/ROADMAP.md")
          roadmap = roadmap_path.read_text()
          roadmap = replace_once(roadmap, "Version: `2.56.4`", "Version: `2.56.5`", "roadmap version")
          roadmap = replace_once(roadmap, "Updated: `2026-08-19`", "Updated: `2026-08-20`", "roadmap date")
          note_marker = "## 2. Version note\n\n"
          if roadmap.count(note_marker) != 1:
              raise SystemExit("roadmap version-note marker mismatch")
          note = """Version `2.56.5` closes [`P7.11 — Scoped Operational-Readiness, Lifecycle, Conformance + Stable-Boundary Disposition`](../reviews/P7-11-scoped-operational-readiness-lifecycle-conformance-stable-boundary-disposition.md) as `Complete / PASS` after four functional review/revise iterations and records the companion [`Persistent Internal Scoped Conformance Statement`](../reviews/P7-11-persistent-internal-conformance-statement.md). The one-Organization `Persistent Internal / owner-operated` contour is fit for ongoing internal governed use; RFC-0001 conformance maturity is `Scoped` for operational environment `Local` with subject lifecycle `Not Applicable` for the deployment contour.

P7.11 performs no lifecycle promotion: CAP-001 through CAP-004 remain `Incubating / Provisional`, P6.02 and P6.06 remain `Provisional 0.1.0`, and no first-`Active` or `Stable` proposal is made. All ten P7.01 ADR/stable-boundary triggers were rechecked and none is currently crossed. Exact-release recovery explicitly assumes retrievable canonical source history; supported operation remains the selected owner-operated Mac mini contour; clean-secondary macOS and Linux CI evidence create no general host matrix; credentials/secrets and other host prerequisites remain separately reprovisioned. No external/customer Production, stable/public API/recovery format, SLA/SLO/RPO/RTO/support or certification claim is created.

`P7.11 = Complete / PASS`; M7 criterion 11 is satisfied. `R24 — M7 Operational Hardening + required Milestone Code Health Gate` becomes the current canonical action; M7 criteria 12 and 13 remain downstream before P7.12.

"""
          roadmap = roadmap.replace(note_marker, note_marker + note, 1)
          roadmap = replace_once(
              roadmap,
              "Detailed roadmap: [`PHASE-7-OPERATIONAL-ENTERPRISE-READINESS.md`](PHASE-7-OPERATIONAL-ENTERPRISE-READINESS.md) — `Active 1.2.15`.",
              "Detailed roadmap: [`PHASE-7-OPERATIONAL-ENTERPRISE-READINESS.md`](PHASE-7-OPERATIONAL-ENTERPRISE-READINESS.md) — `Active 1.2.17`.",
              "roadmap phase version",
          )
          roadmap = replace_once(
              roadmap,
              "| `P7.11` | Scoped operational-readiness, lifecycle, conformance + stable-boundary disposition | 🟨 Current | `░░░░░░░░░░ 0%` |",
              "| `P7.11` | Scoped operational-readiness, lifecycle, conformance + stable-boundary disposition | 🟩 Complete / PASS | `██████████ 100%` |",
              "roadmap P7.11 row",
          )
          roadmap = replace_once(
              roadmap,
              "P7.11 scoped readiness / lifecycle / conformance / stable-boundary disposition ← current",
              "P7.11 scoped readiness / lifecycle / conformance / stable-boundary disposition — PASS",
              "roadmap flow P7.11",
          )
          roadmap = replace_once(
              roadmap,
              "R24 hardening + M7 code-health gate",
              "R24 hardening + M7 code-health gate ← current",
              "roadmap flow R24",
          )
          action_marker = "## 11. Current canonical action\n"
          if roadmap.count(action_marker) != 1:
              raise SystemExit("roadmap current-action marker mismatch")
          roadmap = roadmap.split(action_marker, 1)[0] + action_marker + """> **R24 — M7 Operational Hardening + required Milestone Code Health Gate.**

`P7.11 = Complete / PASS` after explicit operational-readiness, lifecycle, scoped-conformance and stable-boundary disposition for the declared `Persistent Internal / owner-operated` contour. The internal deployment is `Scoped` conformant for RFC-0001 operational environment `Local`; deployment-contour subject lifecycle is `Not Applicable`; CAP-001 through CAP-004 remain `Incubating / Provisional`; P6.02 and P6.06 remain `Provisional 0.1.0`; and no P7.01 ADR/stable-boundary trigger is currently crossed.

M7 criterion 11 is satisfied. R24 must now perform the final bounded operational hardening review and required M7 Milestone Code Health Gate. M7 criteria 12 and 13 remain unsatisfied until R24 closes; P7.12 remains downstream. No external/customer Production, capability/Product Contract promotion, public/stable API/recovery boundary, SLA/SLO/RPO/RTO/support or broader conformance promise is implied.
"""
          roadmap_path.write_text(roadmap)
          PY

      - name: Commit roadmap synchronization and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "Arvectum"
          git config user.email "arvectum@gmail.com"
          git rm .github/workflows/p7-11-roadmap-sync.yml
          git add docs/roadmap/ROADMAP.md docs/roadmap/PHASE-7-OPERATIONAL-ENTERPRISE-READINESS.md
          git diff --cached --check
          git commit -m "docs: synchronize roadmaps after P7.11"
          git push origin HEAD:main
