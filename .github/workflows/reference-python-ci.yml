name: Reference Python CI

on:
  pull_request:
    paths:
      - "reference/python/**"
      - ".github/workflows/reference-python-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full reference test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: reference/python

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run architecture fitness tests
        run: python -m unittest discover -s tests -v
