name: reference-python-ci

on:
  push:
    paths:
      - "reference/python/**"
      - ".gitignore"
      - ".github/workflows/reference-python-ci.yml"
  pull_request:
    paths:
      - "reference/python/**"
      - ".gitignore"
      - ".github/workflows/reference-python-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject tracked Python generated artifacts
        working-directory: .
        shell: bash
        run: |
          tracked="$(git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$|(^|/)\.pytest_cache/' || true)"
          if [ -n "$tracked" ]; then
            echo "Tracked generated Python artifacts are not allowed:"
            printf '%s\n' "$tracked"
            exit 1
          fi
      - name: Run reference Python tests
        run: python -m unittest discover -s tests -p "test_*.py"
