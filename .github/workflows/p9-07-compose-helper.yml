name: P9.07 Temporary Composition Build

on:
  push:
    branches:
      - "p9-07-product-workspace-composition"
    paths:
      - ".github/workflows/p9-07-compose-helper.yml"

permissions:
  contents: write

jobs:
  compose:
    if: github.repository == 'arvectum/arvectum-os' && github.ref == 'refs/heads/p9-07-product-workspace-composition'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p9-07-product-workspace-composition
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: reference/python/workspace_frontend/package-lock.json
      - name: Apply bounded P9.07 composition slice
        shell: python
        run: |
          from pathlib import Path

          root = Path("reference/python")

          products = root / "workspace_app/products.py"
          text = products.read_text(encoding="utf-8")
          text = text.replace("from .access import AccessContext\n", "from .access import AccessContext\nimport p7_03_durable_state as p703\n")
          text = text.replace(
              '''        manifest = _read_json(\n            self.runtime_root / "state" / "governed" / "items" / item_id / "manifest.json",\n            label="P7.07 governed item manifest",\n        )\n''',
              '''        try:\n            manifest = p703.verify_item(self.runtime_root / "state" / "governed" / "items" / item_id)\n        except Exception as exc:\n            raise ProductCompositionError("P7.07 governed item integrity verification failed") from exc\n''',
          )
          text = text.replace(
              "A verified Discount Parser CAP-004 reconstruction context is retained. Reconstruction is read-only and does not replay Telegram or another external effect.",
              "A verified Discount Parser CAP-004 reconstruction context is retained. Reconstruction is read-only and does not replay a historical external effect.",
          )
          text = text.replace(
              "Product-owned publication evidence; platform reconstruction is read-only",
              "Product-owned external-outcome evidence; platform reconstruction is read-only",
          )
          products.write_text(text, encoding="utf-8")

          main = root / "workspace_app/main.py"
          text = main.read_text(encoding="utf-8")
          text = text.replace(
              "from .governed import GovernedExperienceError, GovernedExperienceProvider, RuntimeGovernedExperienceProvider\n",
              "from .governed import GovernedExperienceError, GovernedExperienceProvider, RuntimeGovernedExperienceProvider\nfrom .products import ProductCompositionError, ProductCompositionProvider, RuntimeProductCompositionProvider\n",
          )
          text = text.replace(
              '{"id": "products", "label": "Products", "href": "/products", "availability": "planned-p9.07"},',
              '{"id": "products", "label": "Products", "href": "/products", "availability": "available"},',
          )
          text = text.replace(
              "    governed_provider: GovernedExperienceProvider | None = None,\n    session_store: SessionStore | None = None,",
              "    governed_provider: GovernedExperienceProvider | None = None,\n    product_provider: ProductCompositionProvider | None = None,\n    session_store: SessionStore | None = None,",
          )
          text = text.replace(
              "    governed = governed_provider or RuntimeGovernedExperienceProvider(settings.runtime_root)\n    store = session_store or SessionStore(",
              "    governed = governed_provider or RuntimeGovernedExperienceProvider(settings.runtime_root)\n    products = product_provider or RuntimeProductCompositionProvider(settings.runtime_root)\n    store = session_store or SessionStore(",
          )
          text = text.replace(
              "    app.state.governed_provider = governed\n    app.state.session_store = store",
              "    app.state.governed_provider = governed\n    app.state.product_provider = products\n    app.state.session_store = store",
          )
          marker = '''    @app.get("/api/app/v1/governed")\n'''
          route = '''    @app.get("/api/app/v1/products")\n    async def read_product_composition(\n        current: tuple[WorkspaceSession, AccessContext] = Depends(_authorize_current),\n    ) -> dict[str, Any]:\n        _, access = current\n        try:\n            return products.project(access).to_payload()\n        except ProductCompositionError:\n            raise HTTPException(status_code=status.HTTP_503_SERVICE_UNAVAILABLE, detail="PRODUCT_COMPOSITION_UNAVAILABLE") from None\n\n'''
          if route not in text:
              text = text.replace(marker, route + marker)
          main.write_text(text, encoding="utf-8")

          types = root / "workspace_frontend/src/types.ts"
          text = types.read_text(encoding="utf-8")
          addition = r'''

export type ProductSurfaceContext = {
  id: string;
  label: string;
  ownership: "product-owned";
  repository: string;
  product_contract: {
    id: string;
    version: string;
    lifecycle: "Provisional";
  };
  contour: {
    id: string;
    operating_scope: string;
    status: string;
    summary: string;
    shared_dependencies: string[];
    source_authority: string;
  };
  interaction: {
    kind: "inspect-product-context";
    product_specific_work_stays_product_owned: true;
    authority_provided: false;
    canonical_mutation_available: false;
    external_effect_available: false;
  };
  technical: {
    product_release_sha: string | null;
    evidence_refs: string[];
  };
};

export type ProductCompositionProjection = {
  schema: "arvectum.workspace.product-composition/1";
  generated_at: string;
  projection: {
    derived: true;
    canonical_authority: false;
    product_semantics_owned_by_platform: false;
    organizational_authority_provided: false;
    cross_product_business_relationship_inferred: false;
  };
  scope: {
    organization_resolved_server_side: true;
    actor_resolved_server_side: true;
    current_access_revalidated: true;
    switching_products_broadens_authorization: false;
  };
  products: ProductSurfaceContext[];
};
'''
          if "export type ProductSurfaceContext" not in text:
              text += addition
          types.write_text(text, encoding="utf-8")

          api = root / "workspace_frontend/src/api.ts"
          text = api.read_text(encoding="utf-8")
          text = text.replace("  ObjectContext,\n  WorkspaceContext,", "  ObjectContext,\n  ProductCompositionProjection,\n  WorkspaceContext,")
          marker = "export async function loadGovernedExperience(): Promise<GovernedExperienceProjection> {"
          addition = '''export async function loadProductComposition(): Promise<ProductCompositionProjection> {\n  return request<ProductCompositionProjection>("/api/app/v1/products");\n}\n\n'''
          if addition not in text:
              text = text.replace(marker, addition + marker)
          api.write_text(text, encoding="utf-8")

          surface_dir = root / "workspace_frontend/src/product_surfaces"
          surface_dir.mkdir(parents=True, exist_ok=True)
          (surface_dir / "types.ts").write_text(r'''import type { ProductSurfaceContext } from "../types";

export type ProductSurfaceContribution = {
  id: string;
  render: (surface: ProductSurfaceContext) => JSX.Element;
};
''', encoding="utf-8")
