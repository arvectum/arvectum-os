        client = TestClient(failing, base_url="http://127.0.0.1:8769"); boot = client.post("/api/app/v1/session/bootstrap", headers={**self.headers, "Origin": "http://127.0.0.1:8769"}); self.assertEqual(boot.status_code, 200); response = client.get("/api/app/v1/products", headers=self.headers); self.assertEqual(response.status_code, 503); self.assertEqual(response.json()["detail"], "PRODUCT_COMPOSITION_UNAVAILABLE")


class ProductCompositionPayloadTests(unittest.TestCase):
