class ProductCompositionBffTests(unittest.TestCase):
    def setUp(self) -> None:
        self.temp = tempfile.TemporaryDirectory(); root = Path(self.temp.name); static = root / "dist"; static.mkdir(); (static / "index.html").write_text("ok")
        self.provider = FakeProducts(); self.app = create_app(settings(root), access_resolver=FakeResolver(), product_provider=self.provider, static_dir=static); self.client = TestClient(self.app, base_url="http://127.0.0.1:8769"); self.headers = {RELEASE_HEADER: "p9.07.1"}
        response = self.client.post("/api/app/v1/session/bootstrap", headers={**self.headers, "Origin": "http://127.0.0.1:8769"}); self.assertEqual(response.status_code, 200)
    def tearDown(self) -> None: self.temp.cleanup()
    def test_products_requires_current_session_and_returns_only_non_authoritative_composition(self) -> None:
        response = self.client.get("/api/app/v1/products", headers=self.headers); self.assertEqual(response.status_code, 200); payload = response.json(); self.assertFalse(payload["projection"]["canonical_authority"]); self.assertFalse(payload["projection"]["cross_product_business_relationship_inferred"]); self.assertEqual([p["product_contract"]["lifecycle"] for p in payload["products"]], ["Provisional", "Provisional"]); self.assertTrue(all(not p["interaction"]["authority_provided"] for p in payload["products"])); self.assertEqual(self.provider.calls, 1)
    def test_unavailable_product_evidence_fails_closed(self) -> None:
