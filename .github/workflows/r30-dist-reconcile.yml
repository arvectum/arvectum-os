name: R30 Temporary Dist Reconciliation

on:
  push:
    branches:
      - "r30-m9-alpha-usability-review"
    paths:
      - ".github/workflows/r30-dist-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.repository == 'arvectum/arvectum-os' && github.ref == 'refs/heads/r30-m9-alpha-usability-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reference/python/workspace_frontend
    steps:
      - name: Check out exact review branch
        uses: actions/checkout@v4
        with:
          ref: r30-m9-alpha-usability-review
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: reference/python/workspace_frontend/package-lock.json
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Re-run frontend source gates
        run: |
          npm run typecheck
          npm test
          npm run guard:web-storage
      - name: Build exact production assets
        run: npm run build
      - name: Commit only deterministic dist reconciliation
        working-directory: .
        run: |
          git add reference/python/workspace_frontend/dist
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Production assets already reconciled"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "R30 reconcile exact workspace production assets"
          git push origin HEAD:r30-m9-alpha-usability-review
